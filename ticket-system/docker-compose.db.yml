# =====================================================================
#  Só a base de dados (para quem corre o backend/frontend à mão, com npm).
#  Uso:  docker compose -f docker-compose.db.yml up -d
# =====================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: ticket_db
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticketdb
      TZ: Europe/Lisbon
      PGTZ: Europe/Lisbon
    ports:
      - "5432:5432"
    volumes:
      - ticket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticketdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ticket_pgdata:
